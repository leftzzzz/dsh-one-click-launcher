name: Release launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate launcher scripts
        shell: pwsh
        run: |
          node --check dsh-manager.mjs
          bash -n start-dsh.sh

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./start-dsh.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          zip -j dist/dsh-one-click-bootstrap-windows.zip \
            start-dsh.cmd start-dsh.ps1 dsh-manager.mjs README.md README.zh-CN.md

          chmod +x start-dsh.sh
          tar -czf dist/dsh-one-click-bootstrap-linux-macos.tar.gz \
            start-dsh.sh dsh-manager.mjs README.md README.zh-CN.md

          cd dist
          sha256sum \
            dsh-one-click-bootstrap-windows.zip \
            dsh-one-click-bootstrap-linux-macos.tar.gz \
            > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/dsh-one-click-bootstrap-windows.zip
            dist/dsh-one-click-bootstrap-linux-macos.tar.gz
            dist/SHA256SUMS.txt
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "DSH One-Click Launcher $GITHUB_REF_NAME"
          fi
